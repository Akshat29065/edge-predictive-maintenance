# Reads the machine's Modbus registers and writes them to InfluxDB.
#
# Register map (holding registers, function code 3, addresses start at 0):
#   0-1 rms, 2-3 peak, 4-5 p2p, 6-7 crest, 8-9 kurtosis, 10-11 skew,
#   12-13 shape, 14-15 centroid   (float32, high word first = byte order ABCD)
#   16 heartbeat                  (uint16 counter)
#
# To switch from the simulator to a real machine: change MODBUS_HOST and
# MODBUS_PORT in .env, and, if the device uses another register layout, the
# slave_id, byte_order, addresses and types below. Nothing else changes.

[agent]
  interval = "${POLL_INTERVAL}"
  round_interval = true
  flush_interval = "${POLL_INTERVAL}"
  omit_hostname = true

[[inputs.modbus]]
  name = "motor1"
  controller = "tcp://${MODBUS_HOST}:${MODBUS_PORT}"
  configuration_type = "request"
  timeout = "2s"

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "bearing_features"
    fields = [
      { address = 0,  name = "rms",       type = "FLOAT32" },
      { address = 2,  name = "peak",      type = "FLOAT32" },
      { address = 4,  name = "p2p",       type = "FLOAT32" },
      { address = 6,  name = "crest",     type = "FLOAT32" },
      { address = 8,  name = "kurtosis",  type = "FLOAT32" },
      { address = 10, name = "skew",      type = "FLOAT32" },
      { address = 12, name = "shape",     type = "FLOAT32" },
      { address = 14, name = "centroid",  type = "FLOAT32" },
      { address = 16, name = "heartbeat", type = "UINT16"  },
    ]
    [inputs.modbus.request.tags]
      asset = "motor1"
      line = "line1"

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"